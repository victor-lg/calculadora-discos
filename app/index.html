<!doctype html>
<html lang="es">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2b3a">
  <meta name="apple-mobile-web-app-title" content="Discos">
  <title>Calculadora de discos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main>
    <h1>Series de calentamiento</h1>
    <p id="aviso-guardado" class="aviso-guardado" role="status"></p>

    <section aria-labelledby="titulo-carga">
      <h2 id="titulo-carga" class="oculto">Carga</h2>

      <fieldset id="modos">
        <legend>Modo de carga</legend>
      </fieldset>

      <fieldset id="barras">
        <legend>Barra</legend>
        <div id="lista-barras"></div>
        <p id="peso-barra-fijo" class="dato"></p>
        <div id="campo-peso-barra" class="campo">
          <label for="peso-barra">Peso de la barra (kg)</label>
          <input id="peso-barra" type="text" inputmode="decimal" autocomplete="off" aria-describedby="error-barra">
          <p id="error-barra" class="error" role="alert"></p>
        </div>
        <label class="opcion"><input id="collarines" type="checkbox"><span>Collarines de competición</span></label>
      </fieldset>

      <div class="campo">
        <label for="trabajo">Peso de trabajo (kg)</label>
        <input id="trabajo" type="text" inputmode="decimal" autocomplete="off" aria-describedby="error-trabajo indicacion-trabajo">
        <p id="error-trabajo" class="error" role="alert"></p>
        <p id="indicacion-trabajo" class="indicacion"></p>
      </div>

      <fieldset id="discos">
        <legend>Mis discos</legend>
        <div id="lista-discos"></div>
      </fieldset>
    </section>

    <section aria-labelledby="titulo-porcentajes">
      <h2 id="titulo-porcentajes">Porcentajes</h2>
      <ul id="porcentajes" class="porcentajes"></ul>
      <form id="form-porcentaje" class="anadir" novalidate>
        <label for="nuevo-porcentaje" class="oculto">Nuevo porcentaje</label>
        <input id="nuevo-porcentaje" type="text" inputmode="numeric" autocomplete="off" placeholder="%" aria-describedby="error-porcentaje">
        <button type="submit">Añadir</button>
      </form>
      <p id="error-porcentaje" class="error" role="alert"></p>
      <p id="indicacion-porcentajes" class="indicacion"></p>
    </section>

    <section aria-labelledby="titulo-series">
      <h2 id="titulo-series">Series</h2>
      <p id="aviso-barra" class="aviso" role="status"></p>
      <p id="indicacion-discos" class="indicacion"></p>
      <ol id="series" class="series" aria-live="polite"></ol>
    </section>
  </main>
</body>
</html>
