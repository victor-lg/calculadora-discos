# Tests del stack (ADR-0001 §3.7). Lo añade una persona: el token del agente
# no tiene el permiso `workflow` (N5).
#
# Mientras no exista package.json (antes de la primera entrega), el job
# termina en verde sin ejecutar nada, para poder marcarlo ya como check
# obligatorio sin bloquear los PR de documentación.

name: tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Imagen oficial de Playwright: trae Chromium, WebKit y sus dependencias del sistema,
    # así que no hay que instalarlos en cada ejecución (con --with-deps se agotaban los
    # 15 minutos esperando al servidor de paquetes de Ubuntu; PR #12 y #14).
    # Su versión tiene que coincidir exactamente con @playwright/test del package.json.
    # Fijada por digest (índice multiplataforma, comprobado en el registro el 2026-10-25),
    # igual que las acciones por SHA: una etiqueta se puede volver a publicar con otro contenido.
    # Para actualizarla: docker buildx imagetools inspect mcr.microsoft.com/playwright:vX.Y.Z-noble
    #
    # El job corre como root dentro del contenedor y Chromium arranca sin su sandbox.
    # Se acepta porque no da más privilegios que antes: el token es de solo lectura,
    # el job no usa secretos y los E2E solo cargan la app local.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      # Fijada por SHA (v7.0.1, 2026-07-17), igual que en sdd.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ¿Hay código que probar?
        id: hay
        run: |
          if [ -f package.json ]; then echo "si=true" >> "$GITHUB_OUTPUT"
          else echo "si=false" >> "$GITHUB_OUTPUT"; echo "Sin package.json: no hay tests todavía."; fi

      # Fijada por SHA (v7.0.0, 2026-07-14). Versión de Node en .nvmrc (≥ 22).
      - if: steps.hay.outputs.si == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.hay.outputs.si == 'true'
        name: Instalar dependencias (versiones exactas del lockfile, sin scripts de instalación)
        run: npm ci --ignore-scripts

      - if: steps.hay.outputs.si == 'true'
        name: Tests unitarios
        run: node --test "tests/unit/**/*.test.js"

      - if: steps.hay.outputs.si == 'true'
        name: Tests E2E (Chromium y WebKit)
        run: npx playwright test
