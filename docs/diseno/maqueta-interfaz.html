<title>Calculadora de discos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Una sola pantalla de gimnasio: peso arriba, series con la carga en 3D como protagonistas, "Carga" y "Mis discos" plegados.
   Tema único oscuro. Objetos físicos en 3D (una sola luz de estudio); controles planos; un solo acento, naranja. */
:root{
  color-scheme: dark;
  --bg:#0d0e10; --surface:#16181b; --surface-2:#1e2125; --line:#2b2f35;
  --fg:#f1f2f4; --fg-muted:#a6abb3;
  --accent:#ff8a2a; --accent-ink:#1a0e02;
  --font-num:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-ui);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding-block:20px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);font-weight:600}
.flecha{width:18px;height:18px;flex:none;color:var(--fg-muted);transition:transform .25s}
[aria-expanded="true"]>.flecha{transform:rotate(180deg)}

.peso{display:flex;flex-direction:column;gap:2px}
.peso label{font-size:13px;color:var(--fg-muted);font-weight:500}
.peso-campo{display:flex;align-items:baseline;gap:6px;cursor:text;border-bottom:2px solid var(--line);padding-bottom:2px;transition:border-color .2s}
.peso-campo:focus-within{border-color:var(--accent)}
.auto{display:inline-grid;min-width:0}
.auto::after,.auto input{grid-area:1/1;font:inherit;letter-spacing:inherit;font-variant-numeric:inherit;margin:0;border:0;padding:0 3px 0 0}
.auto::after{content:attr(data-v);visibility:hidden;white-space:pre;overflow:hidden}
.auto input{width:0;min-width:100%}
#peso-auto{max-width:calc(100% - 40px);font-family:var(--font-num);font-weight:600;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
#peso{background:none;outline:none;caret-color:var(--accent)}
.peso-campo .unidad{font-family:var(--font-num);font-size:24px;color:var(--fg-muted);font-weight:500}

.plegable{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pl-res{width:100%;border:0;background:none;min-height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left}
.pl-res .res{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-panel{display:flex;flex-direction:column;gap:10px;padding:0 10px 12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:500;color:var(--fg-muted)}
.seg button svg{width:40px;height:20px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:76px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tile svg{width:100%;max-width:62px;height:20px}
.tile img{display:block;width:100%;max-width:88px;height:30px;object-fit:contain;-webkit-mask-image:linear-gradient(to right,transparent,#000 22%);mask-image:linear-gradient(to right,transparent,#000 22%)}
.tile .n{font-size:13px;font-weight:600;line-height:1.1}
.tile .w{font-family:var(--font-num);font-size:14px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.tile[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tile[aria-pressed="true"] .w{color:var(--fg)}
.opcion{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 12px;min-height:52px;cursor:pointer}
.opcion b{display:block;font-size:14px;font-weight:600}
.opcion small{display:block;font-size:12px;color:var(--fg-muted)}
.opcion input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.opcion input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.opcion input:checked{background:var(--accent)}
.opcion input:checked::after{transform:translateX(18px);background:var(--accent-ink)}
.nota-maquina{font-size:13px;color:var(--fg-muted);padding:2px 4px}
.barra-peso{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg-muted)}
.barra-peso input{width:84px;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px;font-family:var(--font-num);font-size:20px;font-weight:600;text-align:right}
.barra-peso input:focus{border-color:var(--accent);outline:none}
.barra-peso input[aria-invalid="true"]{border-color:#e5484d}
.error{font-size:13px;color:#ff9b9b;padding:0 4px;margin:0}

.bloque{display:flex;flex-direction:column;gap:8px}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--fg)}
.pcts .chip{padding:0 4px 0 14px;font-family:var(--font-num);font-size:18px;font-weight:600}
.pcts .quitar{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--fg-muted)}
.pcts .quitar svg{width:14px;height:14px}
.pcts .add{border-style:dashed;color:var(--fg-muted);padding:0 14px;font-family:var(--font-ui);font-size:15px}
.pcts input{width:72px;min-height:44px;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:0 12px;font-family:var(--font-num);font-size:18px;font-weight:600;text-align:center;outline:none}

.avisos{display:flex;flex-direction:column;gap:6px}
.deslizable{position:relative;border-radius:14px;overflow:hidden}
.fondo-borrar{position:absolute;inset:1px;opacity:0;background:#3b1c1e;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:22px;font-weight:600;color:#ff9592;transition:background .15s,color .15s}
.fondo-borrar svg{transition:transform .15s}
.deslizable.listo .fondo-borrar{background:#e5484d;color:#fff}
.deslizable.listo .fondo-borrar svg{transform:scale(1.15)}
.fondo-borrar svg{width:20px;height:20px}
.deslizable.arrastra .fondo-borrar{opacity:1}
.deslizable .serie{position:relative;touch-action:pan-y;transition:transform .2s ease;user-select:none;-webkit-user-select:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}
.sr:focus{position:static;width:auto;height:auto;clip:auto;margin-top:6px;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.anadir button{width:100%;min-height:48px;border:1.5px dashed var(--line);background:none;border-radius:14px;color:var(--fg-muted);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.anadir button:hover{color:var(--fg);border-color:var(--fg-muted)}
.anadir form{display:flex;gap:4px;cursor:text;align-items:center;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:6px 6px 6px 14px}
#pct-auto{flex:none;max-width:60%;font-family:var(--font-num);font-size:22px;font-weight:600}
.anadir input{background:none;outline:none;min-height:40px}
.anadir form .unidad{font-family:var(--font-num);font-size:18px;color:var(--fg-muted);margin-right:auto}
.anadir .cerrar{background:none!important;color:var(--fg-muted)!important;padding:0!important;width:44px;display:grid;place-items:center;margin-right:6px}
.anadir .cerrar svg{width:16px;height:16px}
.anadir form[aria-invalid="true"]{border-color:#e5484d}
.anadir .error{margin-top:6px}
.anadir form button{width:auto;min-height:40px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 14px;font-weight:700}
.toast{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));align-self:center;display:flex;gap:14px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.5);z-index:4}
.toast button{border:0;background:none;color:var(--accent);font-weight:700;min-height:36px;padding:0 8px}
.aviso{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.aviso svg,.nota svg{flex:none;width:16px;height:16px;margin-top:2px;color:var(--fg-muted)}

.series{display:flex;flex-direction:column;gap:10px}
.serie{background:var(--surface);border-radius:14px;padding:12px 8px 12px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px;align-items:center}
.serie .txt{display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.serie .cab{display:flex;align-items:center;gap:8px;min-height:24px}
.serie .pct{font-family:var(--font-num);font-size:18px;font-weight:600;color:var(--fg-muted)}
.serie .tot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-family:var(--font-num);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.serie .tot .kg{white-space:nowrap}
.serie .tot small{font-size:16px;font-weight:500;color:var(--fg-muted)}
.dif{position:relative;border:0;background:var(--line);color:var(--fg);border-radius:999px;padding:4px 8px;font-family:var(--font-num);font-size:14px;font-weight:700;line-height:1}
.dif::before{content:"";position:absolute;inset:-10px}
.dif[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.burbuja{grid-column:1/-1;margin:2px 8px 0 0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35}
.serie .reparto{font-size:14px;color:var(--fg-muted)}
.serie .reparto b{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;font-family:var(--font-num);font-size:20px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.tk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tk i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sin-discos{display:block;margin-top:4px;font-size:15px;font-weight:600;color:var(--fg)}
.col-linea{display:block;margin-top:4px;font-size:13px;font-weight:500;color:var(--fg-muted)}
.tk em{font-style:normal;font-family:var(--font-ui);font-size:12px;font-weight:700;line-height:1;background:var(--line);border-radius:6px;padding:4px 6px}
.dib{min-width:0;position:relative}
.dib canvas{display:block;width:100%;aspect-ratio:1.25;height:auto}
.maquina .dib canvas{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 11%,#000 89%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 11%,#000 89%,transparent)}
.notas{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.nota{display:flex;gap:6px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.nota+.nota{border-top:0;padding-top:0}
.cargando{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--fg-muted)}

.app{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.discos-caja{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.discos-resumen{width:100%;border:0;background:none;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left}
.discos-resumen .t{font-weight:600;font-size:15px}
.discos-resumen .cuenta{font-family:var(--font-num);font-size:14px;font-weight:600;background:var(--line);border-radius:6px;padding:3px 7px}
.puntos{display:flex;gap:4px;flex:1;min-width:0}
.puntos i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.puntos i.off{opacity:.18}
.discos-panel{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:2px 8px 12px}
.disco{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;padding:4px 0;border-radius:10px}
.disco svg{width:40px;height:40px;transition:opacity .2s,filter .2s}
.disco span{font-family:var(--font-num);font-size:14px;font-weight:600}
.disco[aria-pressed="false"] svg{opacity:.25;filter:grayscale(1)}
.disco[aria-pressed="false"] span{color:var(--fg-muted);text-decoration:line-through}

.defs{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:360px){ .serie{grid-template-columns:1fr} #peso-auto{font-size:52px} .disco svg{width:32px;height:32px} }
.sin3d .dib{display:none}
.sin3d .serie{grid-template-columns:1fr}
</style>

<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d737b"/><stop offset=".32" stop-color="#eef1f4"/><stop offset=".55" stop-color="#b9bfc7"/><stop offset="1" stop-color="#4f545b"/></linearGradient>
  <linearGradient id="buje" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f5f7"/><stop offset="1" stop-color="#7f868e"/></linearGradient>
</defs></svg>

<main class="app">
  <div class="peso">
    <label for="peso">Peso de trabajo</label>
    <div class="peso-campo"><span class="auto" id="peso-auto" data-v="100"><input id="peso" size="1" inputmode="decimal" autocomplete="off" maxlength="6" value="100"></span><span class="unidad">kg</span></div>
  </div>

  <div class="plegable">
    <button class="pl-res" id="carga-btn" aria-expanded="false" aria-controls="carga-panel"><span class="eyebrow">Carga</span><span class="res" id="carga-res"></span><svg class="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="pl-panel" id="carga-panel" hidden>
      <div class="seg" id="modos" role="group" aria-label="Modo de carga"></div>
      <div class="bloque" id="barras-bloque">
        <div class="tiles" id="barras" role="group" aria-label="Barra"></div>
        <label class="opcion" for="collares"><span><b>Collarines de competición</b><small>2,5 kg cada uno; suman 5 kg en las series con discos</small></span><input type="checkbox" id="collares" role="switch"></label>
        <div class="barra-peso" id="barra-peso" hidden>
          <label for="barra-peso-in">Peso de la barra</label>
          <input id="barra-peso-in" inputmode="decimal" autocomplete="off" aria-describedby="barra-peso-error"><span>kg</span>
        </div>
        <p class="error" id="barra-peso-error" role="alert" hidden>Escribe un peso de barra entre 1 y 50 kg, con dos decimales como máximo.</p>
      </div>
      <p class="nota-maquina" id="nota-maquina" hidden>Los discos se cargan en el cuerno de la máquina.</p>
    </div>
  </div>

  <div class="discos">
    <div class="discos-caja">
      <button class="discos-resumen" id="discos-btn" aria-expanded="false" aria-controls="discos-panel">
        <span class="t">Mis discos</span><span class="cuenta" id="cuenta" hidden></span><span class="puntos" id="puntos"></span>
        <svg class="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="discos-panel" id="discos-panel" hidden></div>
    </div>
  </div>
  <div class="avisos" id="avisos" aria-live="polite"></div>
  <section class="series" id="series" aria-label="Series"></section>
  <div class="anadir" id="anadir"></div>
  <div class="toast" id="toast" role="status" hidden></div>

</main>
<p id="fallo" hidden style="text-align:center;color:var(--fg-muted);padding:16px">No se ha podido cargar el motor 3D. Recarga la página.</p>
<script>setTimeout(() => { if (!window.__app) document.getElementById('fallo').hidden = false; }, 12000);</script>

<script type="module">

const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const parse = s => { const t = String(s).trim().replace(',', '.'); if (!t) return null; const n = Number(t); return Number.isFinite(n) ? n : NaN; };

/* ---------- Datos: discos IPF (mm), barras y máquina ---------- */
const DISCOS = {

/* ---------- Cálculo: mayor peso, después menos discos, después el disco más grande ---------- */
function mejor(T){
  const habil = ORDEN.filter(w => state.on[w]);

  art.addEventListener('pointermove', e => {
    if (x0 === null) return;

    if (!activo) { if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) { activo = true; art.setPointerCapture(e.pointerId); } else if (Math.abs(my) > 10) { x0 = null; return; } else return; }

    if (x0 === null) return; x0 = null; art.style.transition = '';
    if (activo && dx < -art.offsetWidth * .35) { art.style.transform = 'translateX(-110%)'; setTimeout(() => colapsa(card), 200); }
    else { art.style.transform = ''; card.el.classList.remove('listo'); setTimeout(() => card.el.classList.remove('arrastra'), 220); }

function porQueSinDiscos(r){
  const minimo = Math.min(...ORDEN.filter(w => state.on[w])), col = state.modo === 'barra' && state.collares;
  const inicio = `El ${fmt(r.pct)} % son ${fmt(r.obj)} kg`;
  if (state.modo === 'barra' && r.obj < r.bar) return `${inicio}, menos que la barra (${fmt(r.bar)} kg).`;
  const necesita = state.modo === 'barra' ? r.bar + 2 * (minimo + (col ? COLLARIN : 0)) : state.modo === 'dos' ? 2 * minimo : minimo;
  const falta = Math.round((necesita - r.obj) * 100) / 100;
  const que = state.modo === 'punto' ? `el disco más pequeño (${fmt(minimo)} kg)` : col ? `el disco más pequeño (${fmt(minimo)} kg) y el collarín a cada lado` : `el disco más pequeño (${fmt(minimo)} kg) a cada lado`;
  return `${inicio}: faltan ${fmt(falta)} kg para poner ${que}.`;
}
function texto(card, r){
  const e = card.el, vacia = !r.combo.length, dif = !vacia && r.diff < -0.001;
  e.querySelector('.pct').textContent = `${fmt(r.pct)} %`;
  e.querySelector('.tot').innerHTML = `<span class="kg">${fmt(r.total)}<small> kg</small></span>`;
  e.querySelector('.difw').innerHTML = (dif ? `<button class="dif" aria-expanded="false" aria-label="${fmt(-r.diff)} kg menos que el objetivo. Ver detalle">−${fmt(-r.diff)} kg</button>` : '');
  const bur = e.querySelector('.burbuja'); bur.hidden = true;
  bur.textContent = dif ? `El ${fmt(r.pct)} % de ${fmt(r.obj * 100 / r.pct)} kg son ${fmt(r.obj)} kg. Con tus discos, lo más cercano sin pasarte es ${fmt(r.total)} kg: ${fmt(-r.diff)} kg menos.`
    : '';
  const lado = state.modo === 'punto' ? 'Total en discos' : 'Por lado';
  e.querySelector('.reparto').innerHTML = r.combo.length ? `${lado}<b>${repartoHTML(r.combo)}</b>${r.collares ? `<span class="col-linea">+ collarín de ${fmt(COLLARIN)} kg</span>` : ''}`
    : `<span class="sin-discos">${state.modo === 'barra' ? 'Solo la barra' : 'Sin discos'}</span><span class="col-linea">${porQueSinDiscos(r)}</span>`;
  card.lienzo.setAttribute('aria-label', r.dib.length ? `Carga: ${repartoTexto(r.dib)} kg` : 'Sin discos');
  e.querySelector('.notas').innerHTML = r.falta > 0 ? `<div class="nota">${ICON_INFO}<span>No caben en la manga: faltan ${fmt(Math.ceil(r.falta) / 10)} cm. Se dibujan los que caben.</span></div>` : '';
}
function avisos(W){
  const a = [];
  if (W === null) a.push('Escribe el peso de trabajo.');
  else if (Number.isNaN(W) || W <= 0 || W > 500) a.push('El peso de trabajo debe estar entre 0 y 500 kg.');
  else if (decimales(state.peso) > 2) a.push('El peso de trabajo admite como máximo dos decimales.');
  if (!state.pcts.length) a.push('Añade al menos un porcentaje.');
  if (!ORDEN.some(w => state.on[w])) a.push('Habilita al menos un disco en Mis discos.');
  if (state.modo === 'barra' && W > 0 && W < BARRAS[state.barra].peso) a.push('El peso de trabajo es inferior a la barra: elige una barra más ligera o revisa el peso.');
  return a;
}
function render({anim = true, diferido = false, reinicia = false} = {}){
  const W = parse(state.peso), av = avisos(W);
  $('#avisos').innerHTML = av.map(t => `<div class="aviso">${ICON_INFO}<span>${t}</span></div>`).join('');
  const barraMal = state.modo === 'barra' && BARRAS[state.barra].editable && state.barraMal;
  const bloquea = barraMal || W === null || Number.isNaN(W) || W <= 0 || W > 500 || decimales(state.peso) > 2 || !state.pcts.length || !ORDEN.some(w => state.on[w]);
  if (bloquea) { cards.forEach(c => { vacia(c); scene.remove(c.grupo); }); cards = []; $('#series').replaceChildren(); return; }
  const libres = cards.slice(), nuevas = [];
  for (const pct of state.pcts) { const i = libres.findIndex(c => c.pct === pct); nuevas.push(i >= 0 ? libres.splice(i, 1)[0] : Object.assign(nuevaTarjeta(pct), {nueva:true})); }
  libres.forEach(c => { vacia(c); scene.remove(c.grupo); });
  cards = nuevas; $('#series').replaceChildren(...cards.map(c => c.el));
  if (anim && !reduce) cards.forEach(c => { if (c.nueva) c.el.animate([{opacity:0, transform:'translateY(-8px) scale(.98)'}, {opacity:1, transform:'none'}], {duration:240, easing:'cubic-bezier(.2,.8,.2,1)'}); });
  cards.forEach(c => c.nueva = false);
  ajustaTamano();
  const res = cards.map(c => serie(c.pct, W));
  cards.forEach((c, i) => texto(c, res[i]));
  if (reinicia) cards.forEach(vacia);
  clearTimeout(timer);
  const pinta = () => cards.forEach((c, i) => aplicar(c, res[i].dib, anim, i * 90));
  if (diferido) timer = setTimeout(pinta, 400); else pinta();
}

const anchoPeso = () => { const i = $('#peso'); i.parentNode.dataset.v = i.value || '0'; };
$('.peso-campo').addEventListener('click', e => { if (e.target.id !== 'peso') $('#peso').focus(); });
$('#peso').addEventListener('input', e => { anchoPeso(); state.peso = e.target.value; guarda('peso', state.peso); render({diferido:true}); });
$('#collares').addEventListener('change', e => { state.collares = e.target.checked; guarda('collares', state.collares ? '1' : '0'); resumenCarga(); render(); });
$('#carga-btn').addEventListener('click', e => { const b = e.currentTarget, ab = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', String(!ab)); $('#carga-panel').hidden = ab; });
$('#modos').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b || b.dataset.m === state.modo) return;
  const antes = equipo(); state.modo = b.dataset.m; pintaModos();
  if (equipo() !== antes) { construye(); encuadra(); render({reinicia:true}); } else render();
});
$('#barras').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (!b || b.dataset.b === state.barra) return; state.barra = b.dataset.b; state.barraMal = false; $('#barra-peso-error').hidden = true; $('#barra-peso-in').setAttribute('aria-invalid', 'false'); pintaBarras(); construye(); render({reinicia:true}); });
$('#barra-peso-in').addEventListener('input', e => {
  const v = parse(e.target.value), ok = v >= 1 && v <= 50 && decimales(e.target.value) <= 2;
  e.target.setAttribute('aria-invalid', String(!ok)); $('#barra-peso-error').hidden = ok;
  state.barraMal = !ok;
  if (!ok) return render();
  BARRAS[state.barra].peso = v; guarda(`barra-${state.barra}`, String(v));
  const w = $(`[data-b="${state.barra}"] .w`); if (w) w.textContent = `${fmt(v)} kg`; resumenCarga(); render({diferido:true});
});
$('#anadir').addEventListener('click', e => { if (e.target.closest('#pct-add')) { anadiendo = true; pintaAnadir(); } else if (e.target.closest('.cerrar')) cierraPct(); });
function cierraPct(){ anadiendo = false; errorPct = valorPct = ''; pintaAnadir(); }
function confirmaPct(desdeFoco = false){
  const inp = $('#pct-nuevo'); if (!inp) return;
  const v = parse(inp.value); valorPct = inp.value.replace(/[^0-9.,]/g, '');
  const entero = Number.isInteger(v) && v >= 1 && v <= 100;
  if (v === null) return cierraPct();
  errorPct = !entero ? 'Escribe un porcentaje entre 0 y 100.'
    : state.pcts.includes(v) ? `Ya tienes una serie del ${fmt(v)} %.` : '';
  if (errorPct) {
    if (!desdeFoco) pintaAnadir();
    else { $('#form-pct').setAttribute('aria-invalid', 'true'); const er = $('#pct-error'); er.textContent = errorPct; er.hidden = false; }
    return;
  }
  state.pcts.push(v); state.pcts.sort((a, b) => a - b); cierraPct(); render();
}
$('#anadir').addEventListener('input', e => { if (e.target.id === 'pct-nuevo') anchoPct(); });
$('#anadir').addEventListener('pointerdown', e => { if (e.target.id === 'form-pct' || e.target.classList.contains('unidad')) { e.preventDefault(); $('#pct-nuevo').focus(); } });
$('#anadir').addEventListener('submit', e => { e.preventDefault(); confirmaPct(); });
$('#anadir').addEventListener('keydown', e => { if (e.target.id === 'pct-nuevo' && e.key === 'Escape') cierraPct(); });
$('#anadir').addEventListener('focusout', e => { if (anadiendo && !$('#anadir').contains(e.relatedTarget)) confirmaPct(true); });
$('#toast').addEventListener('click', e => { if (!e.target.closest('#deshacer') || deshacer === null) return; if (!state.pcts.includes(deshacer)) state.pcts.push(deshacer); state.pcts.sort((a, b) => a - b); deshacer = null; $('#toast').hidden = true; render(); });
$('#series').addEventListener('click', e => {
  const q = e.target.closest('[data-borrar]'); if (q) { const c = cards.find(x => x.el.contains(q)); if (c) colapsa(c); return; }
  const b = e.target.closest('.dif');
  document.querySelectorAll('.dif[aria-expanded="true"]').forEach(x => { if (x !== b) { x.setAttribute('aria-expanded', 'false'); x.closest('.serie').querySelector('.burbuja').hidden = true; } });
  if (!b) return;
  const ab = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', String(!ab)); b.closest('.serie').querySelector('.burbuja').hidden = ab;
});
$('#discos-btn').addEventListener('click', e => { const b = e.currentTarget, ab = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', String(!ab)); $('#discos-panel').hidden = ab; });
$('#discos-panel').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; const w = Number(b.dataset.d); state.on[w] = !state.on[w]; pintaDiscos(); render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) cards.forEach(c => c.sucio = true); });
new ResizeObserver(() => { const antes = tamano.w; ajustaTamano(); if (tamano.w !== antes) cards.forEach(c => c.sucio = true); }).observe($('#series'));

await Promise.race([document.fonts.load(`800 64px ${FUENTE}`).then(() => document.fonts.load(`700 64px ${FUENTE}`)), new Promise(r => setTimeout(r, 3000))]);
$('#peso').value = state.peso; anchoPeso(); $('#collares').checked = state.collares;
pintaModos(); pintaBarras(); pintaAnadir(); pintaDiscos(); construye();
try { miniaturas(); pintaBarras(); } catch (e) { console.warn(e); }
tamano = {w:0, h:0};
render({anim:false});
requestAnimationFrame(bucle);
</script>
