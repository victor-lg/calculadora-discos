# Excepciones de osv-scanner (job `osv-scanner` de seguridad.yml). La CI usa el
# fichero de `main`: un cambio aquí es R2 y vale después del merge. Cada
# excepción caduca con `effectiveUntil` y lleva su motivo.

# minimatch 10.2.6, qs 6.15.1 y glob 13.0.7 los traen dos paquetes de Stryker
# 10.1.1, la última versión (VIC-27), y las versiones corregidas no caben en sus
# rangos:
# - @stryker-mutator/core fija minimatch en ~10.2.4 y, a través de
#   typed-rest-client 2.3.1, qs en 6.15.1;
# - @stryker-mutator/tap-runner fija glob en ~13.0.0 (la corregida es la 14.0.2),
#   y glob pide a su vez minimatch ^10.2.2.
# Son dependencias de desarrollo que solo corren en la CI (job `mutaciones`) sobre
# el código del repo, sin entrada externa: la única entrada es el código de la
# rama, que ese job ya ejecuta. qs solo lo usan el reporter `dashboard` y
# `stryker init`, que la CI no lanza. glob solo lo llama tap-runner, con el patrón
# `tap.testFiles` del stryker.config.json de `main`, sobre el árbol de la rama.
#
# `effectiveUntil` sustituye a `ignoreUntil` (obsoleto en osv-scanner 2.7.1, que
# usa uno u otro igual: internal/config/config.go). Una clave mal escrita deja la
# fecha vacía, y osv-scanner trata una fecha vacía como excepción sin caducidad.
#
# Alcance real: IgnoredVulns filtra solo por ID de aviso, no por paquete, versión,
# ruta ni ámbito. Hasta la caducidad, estos seis avisos quedan silenciados en
# cualquier lockfile del repo y en cualquier versión afectada de qs, minimatch o
# glob, también si los trae una dependencia de producción, y también en la tarea
# mensual (osv-mensual.yml). Un PR que añada dependencias de producción mira a
# mano si trae qs, minimatch o glob mientras dure la excepción.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
effectiveUntil = 2027-02-16
reason = "minimatch 10.2.6, dependencia de desarrollo de @stryker-mutator/core 10.1.1 (la última); solo corre en la CI sobre código del repo, sin entrada externa (VIC-27)"

