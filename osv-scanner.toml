# Excepciones de osv-scanner (job `osv-scanner` de seguridad.yml). La CI usa el
# fichero de `main`: un cambio aquí es R2 y vale después del merge. Cada
# excepción caduca con `ignoreUntil` y lleva su motivo.

# minimatch 10.2.6 y qs 6.15.1 los trae @stryker-mutator/core 10.1.1, la última
# versión de Stryker (VIC-27): fija minimatch en ~10.2.4 (también lo pide glob
# 13.0.7, otra dependencia suya, con ^10.2.2) y, a través de typed-rest-client
# 2.3.1, qs en 6.15.1, así que las versiones corregidas no caben en sus rangos.
# Son dependencias de desarrollo que solo corren en la CI (job `mutaciones`) sobre
# el código del repo, sin entrada externa: la única entrada es el código de la
# rama, que ese job ya ejecuta. qs solo lo usan el reporter `dashboard` y
# `stryker init`, que la CI no lanza.
#
# Alcance real: IgnoredVulns filtra solo por ID de aviso, no por paquete, versión,
# ruta ni ámbito. Hasta la caducidad, estos cinco avisos quedan silenciados en
# cualquier lockfile del repo y en cualquier versión afectada de qs o minimatch,
# también si los trae una dependencia de producción, y también en la tarea
# mensual (osv-mensual.yml). Un PR que añada dependencias de producción mira a
# mano si trae qs o minimatch mientras dure la excepción.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-16
reason = "minimatch 10.2.6, dependencia de desarrollo de @stryker-mutator/core 10.1.1 (la última); solo corre en la CI sobre código del repo, sin entrada externa (VIC-27)"

