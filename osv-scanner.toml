# Excepciones de osv-scanner (job `osv-scanner` de seguridad.yml). La CI usa el
# fichero de `main`: un cambio aquí es R2 y vale después del merge. Cada
# excepción caduca con `ignoreUntil` y lleva su motivo.

# minimatch 10.2.6 y qs 6.15.1 los trae @stryker-mutator/core 10.1.1, la última
# versión de Stryker (VIC-27): fija minimatch en ~10.2.4 y, a través de
# typed-rest-client 2.3.1, qs en 6.15.1, así que las versiones corregidas no
# caben en sus rangos. Son dependencias de desarrollo que solo corren en la CI
# (job `mutaciones`) sobre el código del repo, sin entrada externa.

[[IgnoredVulns]]
